# Default search configuration. Paths are relative to the data root, which is
# resolved as: --data-dir > $DNASTY_DATA_DIR > data_dir below.
nas:
  seed: 0
  device: cpu
  data_dir: datasets
  data:
    name: cpsc2d          # cpsc2d (wavelet images) or cpsc1d (raw lead)
    subdir: cpsc_data/test100
    reference: cpsc_data/reference300.csv
    wavelet: mexh
    lead: 3
    train_pct: 0.6
    num_workers: 0
  train:
    epochs: 10            # post-search training of the best genomes
    batch_size: 20
    lr: 0.0005
  eval:
    batch_size: 64
  num_classes: 9
  image_dims: 128
  in_channels: 1
  population_size: 10
  generations: 10
  search_strategy: random
  perf_metric: val_acc
  estimator:
    low_fidelity:
      epochs: 1
  search_space:
    cbam:
      cells: 2
      conv: 2
      linear: 2
      max_num_params: 1_000_000
      max_outdims: 25
      min_outdims: 5
